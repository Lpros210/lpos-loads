    {
      "@type": "Question",
      "name": "¿El manifiesto es real o es genérico?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Real — los manifiestos vienen de los datos reales del listado del minorista, no de una plantilla genérica. Los manifiestos pueden tener un pequeño margen de error, igual que en toda la industria — es estándar."
      }
    },
    {
      "@type": "Question",
      "name": "¿Puedo ver el manifiesto antes de pagar?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sí — le enviamos el manifiesto para que revise el contenido y el valor estimado de venta al menudeo antes de comprometerse con una carga."
      }
    },
    {
      "@type": "Question",
      "name": "¿El precio incluye el flete o es solo la mercancía?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "El precio de la mercancía y el flete se cotizan por separado — así puede elegir recoger usted mismo (en Texas) o que le coticemos el flete hasta su bodega en EE. UU. No enviamos a México. Le damos ambos números para que quede claro."
      }
    },
    {
      "@type": "Question",
      "name": "¿Ustedes organizan el flete o solo venden la mercancía?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Las dos opciones — puede organizar su propio flete/recolección, o le cotizamos el flete usando costos reales recientes de esa ruta hasta su bodega."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuánto cuesta el flete desde Texas hasta mi bodega en EE. UU.?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Depende de la ruta, cantidad de tarimas, peso y si necesita rampa hidráulica. Mándenos por WhatsApp su destino y el tamaño de la carga y le damos un estimado basado en cargas recientes comparables — el costo final se confirma con la transportista antes de darle un número en firme."
      }
    },
    {
      "@type": "Question",
      "name": "¿Puedo usar mi propio transportista para recoger la carga?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sí — puede mandar su propio transportista a recoger en Texas. Solo confirme con nosotros la fecha/hora de recolección antes."
      }
    },
    {
      "@type": "Question",
      "name": "He tenido problemas con la transportista que ustedes usan — ¿qué pasa si el flete falla o se cancela?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nos tomamos en serio la confiabilidad de la transportista y estamos trabajando activamente en problemas de flete en algunas rutas. Avísenos de inmediato si una recolección se reprograma o se cae una cita y lo escalamos — es un problema conocido que estamos resolviendo activamente, no algo que vamos a ignorar."
      }
    },
    {
      "@type": "Question",
      "name": "¿Dónde recojo la mercancía?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "La recolección es en Texas. Le confirmamos la ubicación y la dirección exacta al reservar su carga."
      }
    },
    {
      "@type": "Question",
      "name": "¿Necesito cita para recoger o puedo llegar directo?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Por favor confirme una cita de recolección con nosotros primero por WhatsApp para tener la carga lista y el papeleo correcto preparado."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cómo confirmo que mi pago (Zelle/transferencia) ya fue recibido?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Mándenos por WhatsApp una captura de pantalla o el número de confirmación de su pago y lo verificamos y le confirmamos."
      }
    },
    {
      "@type": "Question",
      "name": "¿Con qué frecuencia tienen cargas nuevas disponibles?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nos movemos rápido — no almacenamos inventario, así que las cargas se venden rápido. La disponibilidad depende de lo que esté entrando. Escríbanos por WhatsApp y le decimos qué hay disponible ahora mismo."
      }
    },
    {
      "@type": "Question",
      "name": "¿Tienen mercancía disponible ahora mismo?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Escríbanos por WhatsApp y le decimos exactamente qué tenemos disponible hoy — la disponibilidad cambia rápido porque no almacenamos las cargas."
      }
    },
    {
      "@type": "Question",
      "name": "¿Puedo recoger con mi propio transportista para ahorrar en flete?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sí — recolección en Texas; la ubicación exacta se confirma al reservar. Usted recoge con su propio transportista; no organizamos flete ni cruce a México."
      }
    },
    {
      "@type": "Question",
      "name": "¿Qué necesito para cruzar la carga a México como exportador?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Antes de que liberemos la carga tenga listo: identificación oficial del chofer, nombre de la transportista y placas del tractocamión/remolque, ventana de recolección confirmada, comprobante de pago recibido (wire o Zelle), RFC del exportador, pedimento de exportación o documento aduanal correspondiente, y una persona de contacto en sitio para firmar la lista de empaque."
      }
    }
  ]
